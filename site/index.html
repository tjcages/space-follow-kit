<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceFollowKit</title>
    <meta
      name="description"
      content="SpaceFollowKit makes macOS subwindows follow Spaces with correct z-order and no swipe-time always-on-top glitch."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="hero">
      <section class="hero-card">
        <p class="eyebrow">macOS Swift Package</p>
        <h1>SpaceFollowKit</h1>
        <p class="subtitle">
          Make subwindows follow Spaces with correct z-order and no swipe-time
          “always on top” glitch.
        </p>
        <div class="actions">
          <a class="button primary" href="https://github.com/tjcages/space-follow-kit"
            >View on GitHub</a
          >
          <a class="button secondary" href="https://github.com/tjcages/space-follow-kit#readme"
            >Read docs</a
          >
        </div>
      </section>
      <section class="preview-wrap">
        <img
          class="preview"
          src="./assets/hero.png"
          alt="SpaceFollowKit preview window on macOS"
        />
      </section>
    </main>
  </body>
</html>
